# TriCoach now runs on Cloudflare (wrangler.jsonc). The old Netlify site stays up as it
# is, but must not rebuild: this repository no longer contains Netlify functions, and each
# deploy costs free-plan credits. "exit 0" tells Netlify to skip every build.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 0"
