[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173

# Single-page app: unknown paths serve the app shell (API paths are matched by functions first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
